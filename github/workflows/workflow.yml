name: Workflow_auto
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  job:
    runs-on: ubuntu-latest
    containers:
      python:
        image: python:3.11
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest